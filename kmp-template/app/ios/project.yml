name: MyApp
options:
  bundleIdPrefix: com.example.myapp
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.9"
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../app/common/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: $(inherited) -framework shared -lsqlite3

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: Set Version from Git
        script: |
          VERSION_NAME=$(git -C "$SRCROOT" describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          BUILD_NUMBER=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "1")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        basedOnDependencyAnalysis: false
    preBuildScripts:
      - name: Build KMP Shared Framework
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          cd "$SRCROOT/../.."
          ./gradlew :app:common:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../gradle.properties
        outputFiles:
          - $(DERIVED_FILES_DIR)/kmp-framework-built
