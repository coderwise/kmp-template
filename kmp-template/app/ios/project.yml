name: MyApp
options:
  bundleIdPrefix: com.example.myapp
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.9"
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../app/common/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: $(inherited) -framework shared -lsqlite3

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # MARKETING_VERSION / CURRENT_PROJECT_VERSION come from here, generated by
    # scripts/ios-version.sh. They cannot be stamped during the build: Xcode 26+ writes the
    # bundle's Info.plist after every script phase.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    preBuildScripts:
      - name: Build KMP Shared Framework
        script: |
          cd "$SRCROOT/../.."

          # Refuse to archive a wrong version. The xcconfig is generated, so it can be absent
          # (0.0.0) or stale (generated before the tag being released). Regenerate so the
          # retry succeeds. ACTION=install is what Xcode sets for an archive.
          if [ "$CONFIGURATION" = "Release" ] && [ "${ACTION:-}" = "install" ]; then
            EXPECTED=$(./scripts/ios-version.sh)
            ACTUAL="$MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "error: iOS version is $ACTUAL but git says $EXPECTED." >&2
              echo "note: app/ios/Version.xcconfig has been regenerated; build again." >&2
              exit 1
            fi
          fi

          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          ./gradlew :app:common:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../gradle.properties
        outputFiles:
          - $(DERIVED_FILES_DIR)/kmp-framework-built
