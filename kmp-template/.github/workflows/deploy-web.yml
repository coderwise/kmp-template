name: Deploy Web App to Firebase Hosting

on:
  # Manual only: mobile releases are cut from tags and pushes, and each used to ship the web
  # build to production as a side effect. Deploy the web app deliberately, from the Actions
  # tab (or `gh workflow run deploy-web.yml`).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for getGitCommitCount()

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Web distribution
        run: ./gradlew :app:web:jsBrowserDistribution --stacktrace

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          # A self-hosted runner has the owner's `firebase login` in ~/.config, which the CLI
          # prefers over the service account. An empty config dir makes it use the service account.
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: project-id # replace with your Firebase project ID. Like clockson-bBlah
          channelId: live
          entryPoint: app/web
